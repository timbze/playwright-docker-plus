name: ci

on:
  push:
    tags:
      - v*

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Pick image variant
        id: variant
        run: |
          # Tags ending in -dotnet11 (e.g. v1.1-dotnet11) publish :dotnet11 with the .NET 11 SDK added.
          # Every other v* tag publishes :latest exactly as before.
          # Each build is also pushed under the git tag's name (e.g. :v1.1-dotnet11). CI should use that tag:
          # it never changes, so a runner that does not force-pull cannot keep using an old cached image.
          if [[ "$GITHUB_REF_NAME" == *-dotnet11 ]]; then
            echo "tag=timbze/playwright-docker-plus:dotnet11,timbze/playwright-docker-plus:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
            echo "DOTNET_CHANNEL=11.0" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=timbze/playwright-docker-plus:latest,timbze/playwright-docker-plus:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.variant.outputs.tag }}
          build-args: ${{ steps.variant.outputs.build_args }}
